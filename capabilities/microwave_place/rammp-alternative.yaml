# This capability's contract, as code: sheppy's `alternative` schema plus
# RAMMP's `tier` (and `implements`, once a role contract exists). It is
# transcribed into rammp-deployments/december_2026/sheppy-manifest.yaml.
#
# Keys under `container:` are the compose subset sheppy supports: image,
# command, entrypoint, environment, env_file, network_mode, volumes, devices,
# gpus, privileged, cap_add, cap_drop, ports, user, working_dir. Declare
# hardware here, never in a README step. Do not set RMW_IMPLEMENTATION or
# CYCLONEDDS_URI; rammp-base owns them.
id: microwave_place_real
tier: experimental
kind: docker
container:
  # :dev is mutable and overwritten on every merge to dev. A demo profile needs
  # a release tag or digest; `tier: demo-ready` is rejected without one.
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/microwave_place:dev
  network_mode: host
  ipc: host
  # Runs the same node as the image's CMD, without the launch file. sheppy
  # appends `--ros-args --params-file` to the command; with no command, those
  # args replace the CMD and the node never starts. Run the node's installed
  # executable itself: never `ros2 launch`, which rejects them, nor `ros2 run`,
  # which as PID 1 swallows the stop signal and leaves the node to be SIGKILLed.
  command: ["/module_ws/install/microwave_place/lib/microwave_place/microwave_place_node"]
  # state_dir: the plans, the start position and the descent recordings, kept across restarts.
  # worlds_dir: cuRobo's world files, written here and loaded by the planner by their path, so it is
  # mounted at the SAME path here and in the planner's container.
  volumes:
    - /config/microwave_place:/config/microwave_place
    - /home/snorlax/.ros/rammp_box_opening/worlds:/home/snorlax/.ros/rammp_box_opening/worlds
# Defaults for every value a deployment may change per robot or from the sheppy
# TUI; a profile can override only keys listed here. Hosts, ports and file
# paths go here too, never hard-coded in the node.
params:
  # The arm moves only with this true AND `execute` in the goal; otherwise every goal is a dry run.
  # true only for attended runs, someone on the e-stop.
  allow_execute: false
  # flange face to the closed fingertips (m)
  flange_to_tip: 0.17955
  # contact: vz (m/s, + up) back up to this after moving down; 0.0 came 4.5 s late on the flatbot
  vz_stop: -0.01
  # the hold after contact, this far (m) below the contact point, while the gripper opens
  hold_press: 0.003
  # held in impedance at the start of the lowering this long (s); must end still
  settle_s: 0.2
  # contact more than this (m) above where the box's bottom meets the glass = not the glass
  early_stop: 0.03
  # joint impedance for the settle, lowering, hold, back-out and reset (one set: the stiffness never
  # changes mid-place). Default: the driver's documented starting point (rammp_arm.IMPEDANCE)
  impedance_kq: [80.0, 80.0, 80.0, 80.0, 30.0, 30.0, 30.0]
  impedance_zeta: 0.5
  impedance_torque_limit: [39.0, 39.0, 39.0, 39.0, 9.0, 9.0, 9.0]
  # the hand's speed where the glass should be (m/s): what the contact test was tuned at
  lower_speed: 0.12
  # the plans (plans/, last_plan.json), the start position and the descent recordings (descents/)
  state_dir: /config/microwave_place
  # locate: the scene camera's depth and intrinsics (the 3D detections are not used)
  depth_topic: /scene_camera/depth/image_rect_raw
  camera_info_topic: /scene_camera/color/camera_info
  detections_topic: /perception/object_detections_3d
  # detect continuously until `frames` consecutive detected frames lie within agree_m / agree_deg of their
  # median (at most timeout_s)
  frames: 3
  timeout_s: 20.0
  agree_m: 0.01
  agree_deg: 2.0
  # SAM3's prompt for the whole oven (its outside, for the obstacles)
  microwave_prompt: microwave
  # the tool this far (m) over the turntable glass at the end of the line in, then lowered from there
  above: 0.055
  # the container's spot this far (m) back from the turntable's middle toward the opening, along the oven's axis
  closer: 0.02
  # the hand's heading off the oven's axis (deg, + = left), tried in this order; the first that passes wins
  heading_offsets_deg: [0.0]
  # before the transit, the hand moved this far (cm) level to its left (- = right), tried in this order
  # (each with every heading); the first that passes wins
  side_shifts_cm: [3.0, -3.0, 6.0, -6.0, 9.0, -9.0]
  # the side shift and the transit: every arm and gripper link at least this far (m) from the microwave box
  clear_min: 0.01
  # the hand's tilt vs the start, anywhere on the transit and the lines (deg)
  tilt_max_deg: 2.0
  # cuRobo's world files go here; the planner's container must see this directory at the SAME path
  worlds_dir: /home/snorlax/.ros/rammp_box_opening/worlds
  # the hand's peak speed (m/s; position control, min-jerk: about half of it on average) on the approach
  # (side shift + transit + line in, one motion) and the back-out
  insert_speed: 0.16
  # cuRobo approach: world path resolved by the planner, plus fraction of planned speed.
  take_approach_world: /config/robot/curobo/world.yaml
  take_approach_speed_scale: 0.3
  # take_out: the wrist camera (colour, aligned depth, camera_info); the whole container is found on it
  wrist_topics:
    - /wrist_camera/color/image_raw
    - /wrist_camera/depth/image_rect_raw
    - /wrist_camera/color/camera_info
  # SAM3 prompt: the whole container with its sleeve
  container_prompt: food container together with its blue sleeve
  sam3_threshold: 0.5
  # Historical names: consecutive agreeing whole-container masks; no rim query.
  rim_frames: 3
  rim_mask_iou: 0.85
  rim_timeout_s: 60.0
  # the grasp: the tool frame this far (m) past the detected container point along the hand's heading (- = short of it) ...
  grasp_depth: 0.0
  # ... and this far (m) above it
  grasp_up: 0.035
  # the pre-grasp pose this far (m) back from the grasp along the hand's level heading: the line in's length
  reach_in: 0.30
  # the gripper's opening for the reach in (0 = fully open .. 1 closed)
  grip_open: 0.0
  # the last this far (m) of the line in, in joint impedance (a short stop to switch); position control before it,
  # and from the gripper's close on
  impedance_in: 0.10
  # take_out's joint impedance (the driver caps kq at 400); torque limits: impedance_torque_limit
  take_impedance_kq: [400.0, 400.0, 400.0, 400.0, 200.0, 200.0, 200.0]
  take_impedance_zeta: 0.7
  # the hand's peak speed (m/s) on that impedance part of the line in
  impedance_speed: 0.08
  # after closing: straight up this far (m), then the level line back out
  take_lift: 0.03
  # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
  "arm.tool_z": 0.12
  "arm.dt": 0.02
  "arm.joint_speed": 0.85
  "arm.cart_speed": 0.16
  "arm.contact_joint_speed": 0.5
  "arm.contact_cart_speed": 0.09
  "arm.min_duration_s": 1.0
  "arm.cart_step_m": 0.02
  "arm.cart_step_deg": 5.0
  "arm.rot_equiv_m": 0.15
  "arm.max_knot_jump_deg": 20.0
  "arm.path_tol_rad": 0.15
  "arm.gripper_force": 0.5
  "arm.gripper_speed": 0.5
  "arm.frame": "arm_mount"
  "arm.go_to_speed_scale": 0.3
  "arm.go_to_timeout_s": 120.0
  "arm.go_to_track_m": 0.01
  "arm.go_to_track_deg": 2.0
  "arm.max_ik_err": 0.02
  "arm.max_step_jump_deg": 20.0
  "arm.j6_guard_deg": 115.0
  "arm.j4_guard_deg": 144.0
  "arm.max_continuous_delta_deg": 170.0
  "arm.keep_out_err": 9.0
  "arm.ik_max_iterations": 200
  "arm.clearance_query_m": 0.5
  "arm.fingertip_open_rad": 0.0
  "arm.finger_closed_rad": 0.7
  "arm.state_wait_s": 10.0
  "arm.state_stale_s": 0.5
  "arm.diagnostics_stale_s": 3.0
  "arm.goal_accept_s": 5.0
  "arm.result_margin_s": 30.0
  "arm.poll_s": 0.01
  "arm.cancel_settle_s": 0.4
  "arm.halt_status_wait_s": 0.2
  "arm.planner_wait_s": 5.0
  "arm.go_to_settle_s": 0.3
  "arm.gripper_period_s": 0.02
  "arm.gripper_moved": 0.002
  "arm.gripper_judge_after_s": 0.5
  "arm.gripper_still_s": 0.3
  "arm.plan_timeout_s": 30.0
  "arm.service_wait_s": 5.0
  "arm.service_call_s": 10.0
  "arm.stream_timeout_s": 0.1
  "arm.publisher_match_s": 1.0
  "arm.close_stream_wait_s": 1.0
  "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
  "arm.mock_urdf": ""
publishes: [/microwave_place/status, /microwave_place/sam3_overlay]
subscribes:
  - /tf
  - /tf_static
  - /scene_camera/depth/image_rect_raw
  - /scene_camera/color/camera_info
  - /perception/object_detections_3d
  - /wrist_camera/color/image_raw
  - /wrist_camera/depth/image_rect_raw
  - /wrist_camera/color/camera_info
