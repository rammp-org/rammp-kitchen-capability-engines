# This capability's contract, as code: sheppy's `alternative` schema plus
# RAMMP's `tier`. It is transcribed into
# rammp-deployments/december_2026/sheppy-manifest.yaml.
#
# Declare hardware here, never in a README step. Do not set RMW_IMPLEMENTATION
# or CYCLONEDDS_URI; rammp-base owns them.
id: box_opening_real
tier: experimental
kind: docker
container:
  # :dev is mutable and overwritten on every merge to dev. A demo profile needs
  # a release tag or digest; `tier: demo-ready` is rejected without one.
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/box_opening:dev
  network_mode: host
  ipc: host
  # The node's executable itself. sheppy appends `--ros-args --params-file` to
  # the command, so it cannot be `ros2 launch`; and `ros2 run`, as the
  # container's PID 1, passes no signal on to the node, so `docker stop` would
  # kill a run without its own stop (a motion in flight left uncancelled).
  command: ["/module_ws/install/box_opening/lib/box_opening/box_opening_node"]
  volumes:
    # where runs keep their logs, captures and videos (state_dir)
    - /home/snorlax/.ros/box_opening:/state
    # the active robot's config, read-only, as the planner (and arm_state_publisher) mount it: the
    # planner config whose chair and user layers and arm spheres every plan-free line is held out of
    # (body_layers below, runtime/body). Without it the node's runs stop before they move ("not
    # starting: body model: cannot read /config/robot/curobo/planner.yaml ... Nothing moved.")
    - ./config/robots/current:/config/robot:ro
  # No GPU: nothing in it runs a model. The box comes from the scene segmenter
  # (/perception/object_detections).
# Defaults for every value a deployment may change per robot or from the sheppy
# TUI; a profile can override only keys listed here.
params:
  # false: open_box is reported unavailable and nothing runs (there is no dry
  # run). true only for attended runs, someone on the e-stop.
  allow_execute: false
  # the container's config, in the image's config/containers (or a path)
  container: ankou_pink.yaml
  # the robot's frame, cameras and fixed body, in the image's config (or a path)
  world: world_flatbot.yaml
  # where runs keep their logs, captures and videos (the volume above)
  state_dir: /state
  # a video of both cameras from the grip to the set-down, written after each
  # run (the newest 20 kept): on for attended data collection only
  video: false
  # what the perception sees and decides, drawn for Foxglove
  viz: false
  # debug: each executed run also keeps what its cameras saw (~10 MB a run,
  # the newest 20 kept), and its record's flight files and room maps
  mission_frames: false
  # every motion slowed to this fraction of its speed (0 < x <= 1)
  speed_scale: 1.0
  # the cuRobo planner config whose layers (the chair and its user) and robot spheres every
  # plan-free line and planner goal is held out of (the volume above); unreadable, a run stops
  # before it moves; a run also refuses a planner not started on this same config with world "".
  # "" turns the check off (a bench with no chair)
  body_layers: /config/robot/curobo/planner.yaml
  # where the scene camera finds no container, look for it with the wrist camera from one or two
  # poses over the arm's side (a chair parked side-on to a counter the scene camera cannot see);
  # false: such a run stops with not_found before anything moves. Never for the orchestrator's
  # selection, which is the scene camera's (docs/interface.md)
  wrist_survey: false
  # the wrist camera finds the container: the wrist turns where the arm rests so its camera sees
  # the table in front of the arm (up to four views of the wrist's three joints, first where the
  # scene camera has the box; a lid a view cuts is looked at again), and what it finds there is the
  # box; the scene camera's box only where the wrist finds none. With the orchestrator's selection the
  # wrist's box is taken only where it stands in the direction the scene camera has the selected
  # container (docs/interface.md); the instance the world state is written for is the selected one
  wrist_first: false
  # with wrist_first, for a selection that is NO detection of the scene camera's: the selected id is
  # in none of its frames (the UI's object list typed by hand, orchestrator's interactive_perception_node).
  # true: the wrist looks from its own views, tied to nothing, and what it finds is taken only where
  # it is the ONE container the wrist sees (two or more: not_found). The arm then opens whichever
  # single container stands in front of it, under the selected id. false (the default): such a run
  # ends not_found without turning the wrist. A selection the scene camera does hold is tied to it
  # either way (docs/interface.md)
  wrist_alone: false
  # a run's full lines on the node's console too, between the flight view's (off: kept in
  # runs/console-<stamp>.log of the state folder, and the console is the flight view)
  full_console: false
  # the run's measured table handed to the planner while a way HOME is planned, and at no other time
  # (docs/interface.md, "The planner's world"). `planner_worlds_as` is the folder the PLANNER's container
  # mounts read-only for it, as that container names it, e.g. /box_opening for a planner volume
  #   - <state_dir on the host>/planner_worlds:/box_opening:ro
  # "" (the default): box opening sends the planner no world. `planner_worlds_dir` is the same folder as
  # this node writes it; "" = planner_worlds under state_dir
  planner_worlds_as: ""
  planner_worlds_dir: ""
  # how the arm flies the free air before the press: "impedance" (the default: every leg in the driver's
  # joint impedance, one motion to under the button, as flown 2026-11-12) or "position" (the look and the
  # way in's free-air lines in position control and slower, about a second's stand while the springs come
  # in, then the press on them as ever: the arm follows its path closely, and does not give way to what it
  # meets in the air). "position" is not flown yet. Any other value is refused before anything runs
  air_control: impedance
  # the UI bridge's node: the base class's panel calls (ctx.update_user_panel) go to its
  # request_user_input, with the token each execution's goal carries
  ui_bridge_node_name: ui_bridge_node
  # the mock only (mock: true): how long each of its seven phases lasts, in seconds. 0: its run
  # is over at once. A second or two and the UI can be rehearsed on it with no arm: the run's
  # panel, its bar, Cancel
  mock_phase_s: 0.0
  # the line-up before a run: the user is told which way to move until the container is where the arm
  # opens it, then asked, and the arm moves only on their yes. true: every run lines up before its first
  # move. false (the default): open_box starts its run at once, and lines up only where it finds no press
  # from where the chair stands (it does not end there: docs/interface.md, "Lining up in the middle of a
  # run"). Either way the arm NEVER flies on from a line-up without that yes: Open on the UI's panel, or,
  # for a goal with no UI (sent by hand, or the UI bridge not there), y on /box_opening/answer to the
  # question on the node's console (`open_box_terminal` asks and sends it). With wrist_first the wrist
  # turns to look while the user lines up (gently, and only where the arm stands at rest, or at rest but
  # for a wrist an earlier line-up left turned); without it the scene camera alone follows the container,
  # and one it cannot see is never asked of (open_box ends not_lined_up)
  line_up: false
  # how far from the arm's base (m) the line-up trusts that boundary: a container further out is told to
  # come closer. 0 (the default): as far as the run's own proof plans a press. A robot's profile sets it
  line_up_far_m: 0.0
  # how long (s) a line-up of a goal from the UI waits for the person, the arm at rest with its wrist turned
  # the while: 5 minutes (the owner, 2026-11-19). It needs rammp-orchestrator e17c625 (2026-11-16) or later,
  # whose 120 s restart at every progress item: box opening then sends its newest progress again every 30 s.
  # 0: the orchestrator ends every action 120 s after its goal, and a line-up has what those leave (35 s)
  ui_line_up_s: 300.0
publishes:
  - /box_opening/status
  # the run's gripper commands (runtime/client.py), to the arm driver
  - /setpoint/gripper
  # with viz: true only, what the run's perception sees and decides, for Foxglove
  - /box_opening/viz/scene/annotated/compressed
  - /box_opening/viz/wrist/annotated/compressed
  - /box_opening/viz/markers
  - /box_opening/viz/status
subscribes:
  - /tf
  - /tf_static
  - /joint_states
  - /arm/robot_description
  - /wrist_camera/color/image_raw
  - /wrist_camera/color/camera_info
  - /wrist_camera/depth/image_rect_raw
  - /scene_camera/color/image_raw
  - /scene_camera/color/camera_info
  - /scene_camera/depth/image_rect_raw
  - /scene_camera/depth/camera_info
  - /perception/object_detections
  # the arm driver's diagnostics: its link to the arm, its e-stop (readiness, a refused goal)
  - /diagnostics
  # the driver's estimate of the force on the tool, logged at the press's hold and the set-down
  - /ee_state
  # the driver's contact monitor's residual, logged per motion (with its contact_debug_topic on)
  - /contact_monitor/residual
  # the person's y or n for a goal with no UI to press on (std_msgs/String): y answers a line-up's
  # question, n cancels the action. The node's own subscription, held only while an action runs
  - /box_opening/answer
