# This capability's contract, as code: sheppy's `alternative` schema plus
# RAMMP's `tier` (and `implements`, once a role contract exists). It is
# transcribed into rammp-deployments/december_2026/sheppy-manifest.yaml.
#
# Keys under `container:` are the compose subset sheppy supports: image,
# command, entrypoint, environment, env_file, network_mode, volumes, devices,
# gpus, privileged, cap_add, cap_drop, ports, user, working_dir. Declare
# hardware here, never in a README step. Do not set RMW_IMPLEMENTATION or
# CYCLONEDDS_URI; rammp-base owns them.
id: fridge_real
tier: experimental
kind: docker
container:
  # :dev is mutable and overwritten on every merge to dev. A demo profile needs
  # a release tag or digest; `tier: demo-ready` is rejected without one.
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/fridge:dev
  network_mode: host
  ipc: host
  # Runs the same node as the image's CMD, without the launch file. sheppy
  # appends `--ros-args --params-file` to the command; with no command, those
  # args replace the CMD and the node never starts. Run the node's executable
  # (`ros2 run`), never `ros2 launch`, which rejects them.
  command: ["ros2", "run", "fridge", "fridge_node"]
  # The door geometry and grasp the open saves (the close reads them back) and every run's log:
  # kept on the host, across container restarts.
  volumes:
    - /tmp/fridge_data:/fridge_data
    # The fridge's collision world for the cuRobo planner, written here and loaded by the planner
    # (set_world with its path): the planner container must mount the same host directory at the same
    # path (planner_world_dir), read-only is enough.
    - /tmp/rammp_planner_worlds:/rammp_planner_worlds
# Defaults for every value a deployment may change per robot or from the sheppy
# TUI; a profile can override only keys listed here. Hosts, ports and file
# paths go here too, never hard-coded in the node.
params:
  # false: every goal is a dry run (detect, plan, gate; nothing moves), whatever it asks.
  # true only for attended runs, someone on the e-stop.
  allow_execute: false
  data_dir: /fridge_data
  # The arm's forward lean in its mount (deg): 0 (dojo) or 30 (flatbot, gen_1_5).
  mount_tilt_deg: 0
  # The open's grasp: side (in along the door from the hinge side, one finger behind the bar, tilted
  # -40 to 40 deg) or front (fingers across the bar, straight in). Picks the placement advice.
  grasp: side
  # Wrist camera; depth must be aligned to colour. camera_frame "" = the colour image's frame_id.
  # depth/image_rect_raw is aligned to colour on the D405 and the OAK (flatbot); the D435i's is not --
  # with it, override this to /wrist_camera/aligned_depth_to_color/image_raw.
  color_topic: /wrist_camera/color/image_raw
  camera_info_topic: /wrist_camera/color/camera_info
  depth_topic: /wrist_camera/depth/image_rect_raw
  camera_frame: ""
  # Which camera finds the handle and measures the door: wrist (the topics above; what GRIP_EXT was
  # tuned on) or scene (the scene_* topics below; its handle point is unchecked against GRIP_EXT).
  detect_camera: wrist
  # Where the handle comes from: sam3 (SAM 3's mask of sam3_prompts) or depth (the vertical bar
  # sticking out of the door). door_normal handle_model and handle need sam3.
  handle_source: sam3
  sam3_service: /perception/sam3/detect
  sam3_prompts: [handle]
  sam3_threshold: 0.3
  # Measured on the fridge being opened (m); see Before a run in docs/interface.md.
  # The STL's bar middle; set from the 11-06 measurements once the camera's handle point is measured (TESTING.md).
  handle_centre_to_face_m: 0.070
  pin_behind_face_m: 0.04675
  hinge_along_door_m: 0.3683
  door_width_m: 0.4572
  door_depth_m: 0.10668
  door_above_handle_m: 0.381
  door_below_handle_m: 0.3937
  # NOT MEASURED: the STL's straight bar between its mounts. Measure it.
  handle_length_m: 0.2032
  body_depth_m: 0.5
  # The wheelchair: on the 30-deg mount it is the cuRobo planner's own collision layers, in every
  # world; the level mount (no layers) gets this stand-in box behind the arm base (m) in the fridge's
  # world. And which way moving the chair back moves the fridge in the arm's frame (x, y).
  chair_keep_out_behind_m: 0.381
  chair_back_dir: [1.0, 0.0]
  # cuRobo plans every motion against the fridge: the node writes its collision world into
  # planner_world_dir (the volume above; the planner sees it at planner_world_dir_in_planner, "" = the
  # same path) and loads it with set_world. A pushed world replaces the robot's world.yaml, so it lists
  # that world's layers again (planner_base_layers, as the planner sees them: flatbot's floor; the
  # chair's layers are the planner config's and stay in every world). planner_restore_world is put
  # back when each action ends (resolved next to the planner's config).
  planner_world_dir: /rammp_planner_worlds
  planner_world_dir_in_planner: ""
  planner_base_layers: [/config/robot/curobo/layer_mebot_floor.yaml]
  planner_restore_world: world.yaml
  # How each look measures the door's direction: handle_model (the printed handle's model fit to SAM 3's
  # mask on the depth, as the side grasp's estimator), handle (the bar and its plate), plane (a door-plane
  # fit over the whole image) or square (TESTING ONLY: the door taken as square to the arm).
  door_normal: handle_model
  # Every run also records a rosbag into its run folder: the wrist and scene cameras bag_frame_hz times a second,
  # boxer's 3D boxes and TF (~150 MB a minute at 1). "" for any scene topic: no scene camera; for boxes_topic: no boxes.
  # wrist_infra*: the wrist camera's rectified stereo pair with its camera_infos, for running FoundationStereo on later
  # (~30 MB a minute more at 1; any "": not recorded). The wrist OAK publishes them only with
  # depth.i_left_rect_publish_topic and depth.i_right_rect_publish_topic true (docs/TESTING.md: its 100 Mbit/s link
  # needs them compressed). It names its left mono infra2: the camera_infos' projections say which is left.
  record_bag: true
  bag_frame_hz: 1.0
  scene_color_topic: /scene_camera/color/image_raw
  scene_camera_info_topic: /scene_camera/color/camera_info
  scene_depth_topic: /scene_camera/depth/image_rect_raw
  wrist_infra1_topic: /wrist_camera/infra1/image_rect_raw
  wrist_infra1_info_topic: /wrist_camera/infra1/camera_info
  wrist_infra2_topic: /wrist_camera/infra2/image_rect_raw
  wrist_infra2_info_topic: /wrist_camera/infra2/camera_info
  boxes_topic: /perception/object_detections_3d
  # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
  "arm.tool_z": 0.12
  "arm.dt": 0.02
  "arm.joint_speed": 0.85
  "arm.cart_speed": 0.16
  "arm.contact_joint_speed": 0.5
  "arm.contact_cart_speed": 0.09
  "arm.min_duration_s": 1.0
  "arm.cart_step_m": 0.02
  "arm.cart_step_deg": 5.0
  "arm.rot_equiv_m": 0.15
  "arm.max_knot_jump_deg": 20.0
  "arm.path_tol_rad": 0.15
  "arm.gripper_force": 0.5
  "arm.gripper_speed": 0.5
  "arm.frame": "arm_mount"
  "arm.go_to_speed_scale": 0.3
  "arm.go_to_timeout_s": 120.0
  "arm.go_to_track_m": 0.01
  "arm.go_to_track_deg": 2.0
  "arm.max_ik_err": 0.02
  "arm.max_step_jump_deg": 20.0
  "arm.j6_guard_deg": 115.0
  "arm.j4_guard_deg": 144.0
  "arm.max_continuous_delta_deg": 170.0
  "arm.keep_out_err": 9.0
  "arm.ik_max_iterations": 200
  "arm.clearance_query_m": 0.5
  "arm.fingertip_open_rad": 0.0
  "arm.finger_closed_rad": 0.7
  "arm.state_wait_s": 10.0
  "arm.state_stale_s": 0.5
  "arm.diagnostics_stale_s": 3.0
  "arm.goal_accept_s": 5.0
  "arm.result_margin_s": 30.0
  "arm.poll_s": 0.01
  "arm.cancel_settle_s": 0.4
  "arm.halt_status_wait_s": 0.2
  "arm.planner_wait_s": 5.0
  "arm.go_to_settle_s": 0.3
  "arm.gripper_period_s": 0.02
  "arm.gripper_moved": 0.002
  "arm.gripper_judge_after_s": 0.5
  "arm.gripper_still_s": 0.3
  "arm.plan_timeout_s": 30.0
  "arm.service_wait_s": 5.0
  "arm.service_call_s": 10.0
  "arm.stream_timeout_s": 0.1
  "arm.publisher_match_s": 1.0
  "arm.close_stream_wait_s": 1.0
  "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
  "arm.mock_urdf": ""
publishes: [/fridge/status]
subscribes:
  - /tf
  - /tf_static
  - /wrist_camera/color/image_raw
  - /wrist_camera/color/camera_info
  - /wrist_camera/depth/image_rect_raw
  - /scene_camera/color/image_raw
  - /scene_camera/color/camera_info
  - /scene_camera/depth/image_rect_raw
  - /wrist_camera/infra1/image_rect_raw
  - /wrist_camera/infra1/camera_info
  - /wrist_camera/infra2/image_rect_raw
  - /wrist_camera/infra2/camera_info
  - /perception/object_detections_3d
