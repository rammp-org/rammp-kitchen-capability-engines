# The mock: the real alternative's exact interface, no hardware. Every action succeeds at once
# as a dry run (nothing detected or moved). Other teams develop against it, the all-mock profile
# runs on it, and CI smoke-tests it. check_capabilities.py rejects a mock whose topics differ
# from the real one.
id: button_press_mock
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/button_press:dev
  network_mode: host
  ipc: host
  command: ["ros2", "launch", "button_press", "button_press.launch.py", "mock:=true"]
# No `params:` here: they would need the node's executable as the command, and this fragment uses `ros2 launch` for mock:=true.
publishes:
  - /button_press/status
  - /button_press/target_pose
subscribes:
  - /tf
  - /tf_static
  - /wrist_camera/color/image_raw
  - /wrist_camera/color/camera_info
  - /wrist_camera/depth/image_rect_raw
  - /scene_camera/color/image_raw
  - /scene_camera/color/camera_info
  - /scene_camera/depth/image_rect_raw
  - /scene_camera/depth/camera_info
  - /perception/object_detections
