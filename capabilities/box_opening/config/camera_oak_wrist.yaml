# Wrist OAK-D PoE (flatbot) — rammp-suite-software/oak:0.3.1 topic layout.
#
# The arm URDF carries the full TF chain to the camera's optical frame, so
# mount_xyz/quat are identity: camera_pose_at looks up arm_mount directly to
# wrist_camera_color_optical_frame without any extra math.
#
# The oak container publishes depth registered to colour (depth_registration:
# true in the manifest) on depth/image_rect_raw, in the colour pixel grid.
# find_button samples the depth at colour-image pixels; misaligned depth
# would land on the wrong 3-D point.
color_topic: /wrist_camera/color/image_raw
color_info_topic: /wrist_camera/color/camera_info
aligned_depth_topic: /wrist_camera/depth/image_rect_raw
parent_frame: wrist_camera_color_optical_frame
mount_xyz: [0, 0, 0]
mount_quat_xyzw: [0, 0, 0, 1]
stamp_offset_s: 0.0
# The robot's own mount of this camera: the transform of that name in the active robot's
# transforms/cameras.yaml (rammp-deployments config/robots/<robot>, mounted at /config/robot), whose child
# frame the OAK's driver puts at the colour sensor and whose parent is a link of the hand. Where that file can
# be read the lens from tool_frame, and the camera's axes, are taken from it (perception/d405
# .wrist_camera_in_hand: the parent placed from the flange by the arm's URDF, the tool frame 0.120 m out of
# the flange on every description): flatbot's [0, 0.065, 0.015] is [0, 0.065, -0.105]; gen_1_5's calibration
# of 2026-11-18, [-0.005351, 0.06953, 0.022506], is [-0.005351, 0.06953, -0.097494]. The depth press centres
# on TF's mount only when TF agrees with it within 5 mm sideways (tasks/depth_press.MOUNT_XY_TOL_M): a TF
# tree and a robot config that are not the same robot's are refused there.
robot_mount: wrist_camera
# The lens origin from tool_frame, in its axes (m), kept by hand. It is two things:
#  - what stands in where no robot config is mounted (a test, an offline tool);
#  - the one figure for this lens that no calibration session made: fitted from the 2026-10-22 runs
#    (rammp-deployments#128: [0, 0.065, 0.015] from arm_end_effector_link, tool_frame 0.12 m past it; the
#    hand-measured mount deployed before it, [0, 0.10, -0.10], put the 20:04 press on the lid's edge). A run
#    says at its start how far the robot's calibration stands from it, and the depth press does not centre on
#    a mount more than 9 mm aside of it or 20 mm along the tool (perception/d405.LENS_REF_XY_TOL_M, with what
#    that can and cannot catch).
# So it is NOT to follow a new calibration: leave it be (#105 edited it, in the wrong frame: #106).
wrist_lens_in_hand_m: [0.0, 0.065, -0.105]
