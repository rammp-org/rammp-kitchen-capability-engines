# The mock: the real alternative's exact interface, no hardware. Other teams
# develop against it, the all-mock profile runs on it, and CI smoke-tests it.
# check_capabilities.py rejects a mock whose topics differ from the real one.
id: home_arm_mock
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/home_arm:dev
  network_mode: host
  ipc: host
  # To give make_sim() a model, append "mock_urdf:=/path/to/robot.urdf" (arm.mock_urdf).
  # Standalone, as the real alternative: under an orchestrator the engine refuses go_home.
  command: ["ros2", "launch", "home_arm", "home_arm.launch.py", "mock:=true", "use_orchestrator:=false"]
# No `params:` here: they would need the node's executable as the command, and this fragment uses `ros2 launch` for mock:=true.
publishes: [/home_arm/status]
# through self.arm, during an action only: a read of /joint_states waits for the driver's /ee_state and
# /gripper_state too, and a goal is sent only after its /control_status
subscribes: [/joint_states, /ee_state, /gripper_state, /control_status, /arm/robot_description]
