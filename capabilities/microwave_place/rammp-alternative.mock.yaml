# The mock: the real alternative's exact interface, no hardware. Other teams
# develop against it, the all-mock profile runs on it, and CI smoke-tests it.
# check_capabilities.py rejects a mock whose topics differ from the real one.
id: microwave_place_mock
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/microwave_place:dev
  network_mode: host
  ipc: host
  command: ["ros2", "launch", "microwave_place", "microwave_place.launch.py", "mock:=true"]
# No `params:` here: they would need the node's executable as the command, and this fragment uses `ros2 launch` for mock:=true.
publishes: [/microwave_place/status]
subscribes:
  - /tf
  - /tf_static
  - /scene_camera/depth/image_rect_raw
  - /scene_camera/color/camera_info
  - /perception/object_detections_3d
